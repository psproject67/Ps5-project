name: Build apps
on: [push, workflow_dispatch]
jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unzip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive ps5-app.zip -DestinationPath .
      - name: Unzip
        if: runner.os != 'Windows'
        run: unzip -q ps5-app.zip
      - run: npm install
        working-directory: ps5-app
      - run: npx electron-builder --publish never
        working-directory: ps5-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            ps5-app/dist/*.exe
            ps5-app/dist/*.dmg
            ps5-app/dist/*.AppImage
            ps5-app/dist/*.deb
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: unzip -q ps5-app.zip
      - run: npm install
        working-directory: ps5-app
      - run: npx cap add android && npx cap sync android
        working-directory: ps5-app
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: ps5-app/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ps5-app/android/app/build/outputs/apk/debug/*.apk
