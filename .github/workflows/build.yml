name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if needed
        run: |
          for z in $(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*"); do
            echo "Unzipping $z"
            unzip -oq "$z" -d unzipped
          done

      - name: Find project directory
        run: |
          F=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$F" ]; then echo "settings.gradle.kts not found"; ls -R | head -50; exit 1; fi
          DIR=$(dirname "$F")
          echo "Project dir: $DIR"
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Show APK files
        run: find . -name "*.apk" -not -path "./.git/*"

      - uses: actions/upload-artifact@v4
        with:
          name: TipaxBot-apk
          path: "**/*.apk"
          if-no-files-found: error

      - name: Publish to Releases (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: "**/app-debug.apk"
          fail_on_unmatched_files: true
